name: Auto-Update EV Data

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest EV data
        run: node scripts/fetch-ev-data.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/cars.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new EV data found."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New EV data found!"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/cars.json
          git commit -m "Auto-update: refresh EV data from fueleconomy.gov"
          git push
